<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI生图工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: #333; }
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        .image-upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
        }
        .image-upload-area:hover { border-color: #667eea; background-color: #f8f9ff; }
        .uploaded-images { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .uploaded-image {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
        }
        .uploaded-image img { width: 100%; height: 100%; object-fit: cover; }
        .uploaded-image .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .result-section { margin-top: 30px; display: none; }
        .result-section.show { display: block; }
        .result-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .result-image { max-width: 100%; border-radius: 12px; }
        .error-message {
            background: #fff5f5;
            border-left: 4px solid #ff4d4f;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            color: #d93026;
            margin-top: 15px;
            display: none;
        }
        .error-message.show { display: block; }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AI生图工具</h1>
            <p>输入提示词，生成精美图片</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="prompt">提示词 <span style="color: #ff4d4f;">*</span></label>
                <textarea id="prompt" placeholder="请输入生图提示词"></textarea>
            </div>

            <div class="form-group">
                <label>参考图片（可选）</label>
                <div class="image-upload-area" id="uploadArea">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🖼️</div>
                    <p>点击或拖拽上传图片</p>
                </div>
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <div class="uploaded-images" id="uploadedImages"></div>
            </div>

            <button class="btn btn-primary" id="generateBtn">
                <span>🚀 生成图片</span>
            </button>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-card">
                <h3>✨ 生成结果</h3>
                <img id="resultImage" class="result-image" alt="生成的图片">
                <div style="margin-top: 20px; display: flex; gap: 15px;">
                    <a id="downloadBtn" href="#" download style="flex: 1; text-align: center; padding: 12px; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #333;">⬇️ 下载图片</a>
                    <a href="#" onclick="copyUrl(event)" style="flex: 1; text-align: center; padding: 12px; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #333;">📋 复制链接</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadedImages = [];
        
        document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('imageInput').click());
        
        document.getElementById('imageInput').addEventListener('change', (e) => {
            for (const file of e.target.files) {
                if (uploadedImages.length >= 5) { alert('最多上传5张'); return; }
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    const response = await fetch('https://sd85bjva3fghtjddkv31g.apigateway-cn-guangzhou.volceapi.com/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        uploadedImages.push({ preview: e.target.result, url: data.url });
                        renderImages();
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        function renderImages() {
            const container = document.getElementById('uploadedImages');
            container.innerHTML = uploadedImages.map((img, i) => `
                <div class="uploaded-image">
                    <img src="${img.preview}">
                    <button class="remove-btn" onclick="uploadedImages.splice(${i},1);renderImages()">×</button>
                </div>
            `).join('');
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) { alert('请输入提示词'); return; }
            
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>生成中...';
            
            const response = await fetch('https://sd85bjva3fghtjddkv31g.apigateway-cn-guangzhou.volceapi.com/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, images: uploadedImages.map(i => i.url) })
            });
            
            const data = await response.json();
            if (data.success) {
                document.getElementById('resultImage').src = data.url;
                document.getElementById('downloadBtn').href = data.url;
                document.getElementById('resultSection').classList.add('show');
            } else {
                document.getElementById('errorMessage').textContent = data.error;
                document.getElementById('errorMessage').classList.add('show');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<span>🚀 生成图片</span>';
        });

        function copyUrl(e) {
            e.preventDefault();
            navigator.clipboard.writeText(document.getElementById('resultImage').src).then(() => alert('已复制'));
        }
    </script>
</body>
</html>
