<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单生图助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header a {
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
        }
        .main-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        #chat-frame { flex: 1; width: 100%; border: none; background: white; }
        .loading-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            z-index: 1;
            max-width: 350px;
        }
        .loading-tip .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>🎨 工单生图助手</h1>
            <a href="https://www.coze.cn/space/7520435850309074959/bot/7637934088892661760" target="_blank">↗ 新窗口</a>
        </div>
        <div style="flex: 1; position: relative;">
            <div class="loading-tip" id="loadingTip">
                <div class="spinner"></div>
                <h2>正在加载智能体...</h2>
                <p>如果加载失败，请点击右上角「新窗口」按钮</p>
            </div>
            <iframe id="chat-frame" src="https://www.coze.cn/space/7520435850309074959/bot/7637934088892661760"></iframe>
        </div>
    </div>
    
    <script>
        const iframe = document.getElementById('chat-frame');
        const loadingTip = document.getElementById('loadingTip');
        iframe.onload = function() {
            loadingTip.style.display = 'none';
        };
    </script>
</body>
</html>
