<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单生图助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); padding: 30px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 24px; }
        .upload-area { border: 3px dashed #ddd; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
        .upload-area:hover, .upload-area.dragover { border-color: #667eea; background: #f8f9ff; }
        .upload-area i { font-size: 48px; color: #667eea; margin-bottom: 10px; }
        .upload-area p { color: #666; font-size: 16px; }
        #uploaded-images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .image-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
        .image-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-item .remove-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .prompt-input { width: 100%; padding: 12px 16px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px; margin-bottom: 20px; }
        .prompt-input:focus { outline: none; border-color: #667eea; }
        .generate-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .generate-btn:hover { transform: translateY(-2px); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .loading { display: none; text-align: center; padding: 20px; color: #667eea; }
        .loading.show { display: block; }
        .loading .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result { margin-top: 20px; display: none; }
        .result.show { display: block; }
        .result img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .result .actions { display: flex; gap: 10px; }
        .result .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .result .btn.download { background: #667eea; color: white; }
        .result .btn.copy { background: #f0f0f0; color: #333; }
        .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .error.show { display: block; }
        .tos-info { font-size: 12px; color: #999; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 工单生图助手</h1>
        
        <div id="error-message" class="error"></div>
        
        <div class="upload-area" id="upload-area">
            <div style="font-size:48px;margin-bottom:10px;">📷</div>
            <p>点击或拖拽上传图片</p>
            <p style="font-size:12px;color:#999;margin-top:5px;">支持 JPG、PNG 格式，最多上传3张</p>
        </div>
        
        <div id="uploaded-images"></div>
        
        <textarea class="prompt-input" id="prompt" placeholder="请输入生成提示词..."></textarea>
        
        <button class="generate-btn" id="generate-btn">生成图片</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在生成图片，请稍候...</p>
            <p style="font-size:12px;color:#999;">生成可能需要1-5分钟</p>
        </div>
        
        <div class="result" id="result">
            <img id="result-image" src="" alt="生成结果">
            <div class="actions">
                <button class="btn download" id="download-btn">下载图片</button>
                <button class="btn copy" id="copy-btn">复制链接</button>
            </div>
        </div>
        
        <p class="tos-info">图片将上传至火山引擎TOS，生成结果仅供临时查看</p>
    </div>

    <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
    
    <script>
        const API_BASE_URL = 'https://your-backend-api.herokuapp.com';
        
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const uploadedImages = document.getElementById('uploaded-images');
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generate-btn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');
        const copyBtn = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        
        const uploadedUrls = [];
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });
        
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });
        
        async function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) {
                    showError('请上传图片文件');
                    continue;
                }
                if (uploadedUrls.length >= 3) {
                    showError('最多上传3张图片');
                    break;
                }
                
                try {
                    showLoading(true);
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const response = await fetch(`${API_BASE_URL}/api/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        uploadedUrls.push(data.url);
                        addImagePreview(file, data.url, uploadedUrls.length - 1);
                    } else {
                        showError(data.error || '上传失败');
                    }
                } catch (error) {
                    showError('上传失败: ' + error.message);
                } finally {
                    showLoading(false);
                }
            }
        }
        
        function addImagePreview(file, url, index) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const item = document.createElement('div');
                item.className = 'image-item';
                item.dataset.index = index;
                item.innerHTML = `
                    <img src="${e.target.result}" alt="预览">
                    <button class="remove-btn" onclick="removeImage(${index})">×</button>
                `;
                uploadedImages.appendChild(item);
            };
            reader.readAsDataURL(file);
        }
        
        window.removeImage = function(index) {
            uploadedUrls.splice(index, 1);
            const items = uploadedImages.querySelectorAll('.image-item');
            items.forEach((item, i) => {
                if (parseInt(item.dataset.index) === index) {
                    item.remove();
                } else if (parseInt(item.dataset.index) > index) {
                    item.dataset.index = i;
                }
            });
        }
        
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                showError('请输入提示词');
                return;
            }
            if (uploadedUrls.length === 0) {
                showError('请至少上传一张图片');
                return;
            }
            
            try {
                showLoading(true);
                hideError();
                
                const response = await fetch(`${API_BASE_URL}/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        images: uploadedUrls,
                        timeout: 600
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultImage.src = data.url;
                    result.classList.add('show');
                    loading.classList.remove('show');
                    downloadBtn.onclick = () => downloadImage(data.url);
                    copyBtn.onclick = () => copyLink(data.url);
                } else {
                    showError(data.error || '生成失败');
                }
            } catch (error) {
                showError('请求失败: ' + error.message);
            } finally {
                showLoading(false);
            }
        });
        
        function downloadImage(url) {
            const link = document.createElement('a');
            link.href = url;
            link.download = 'generated_image.png';
            link.target = '_blank';
            link.click();
        }
        
        async function copyLink(url) {
            try {
                await navigator.clipboard.writeText(url);
                alert('链接已复制到剪贴板');
            } catch (error) {
                prompt('复制链接:', url);
            }
        }
        
        function showLoading(show) {
            loading.classList.toggle('show', show);
            generateBtn.disabled = show;
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 5000);
        }
        
        function hideError() {
            errorMessage.classList.remove('show');
        }
    </script>
</body>
</html>
