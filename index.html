<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单生图助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        /* 顶部标题栏 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            height: 56px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            line-height: 24px;
        }
        /* 主容器 */
        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        /* 聊天容器 - 固定高度，确保SDK能渲染 */
        #coze-chat {
            flex: 1;
            width: 100%;
            min-height: calc(100vh - 56px);
            background: #f5f5f5;
            position: relative;
        }
        /* 加载提示 */
        .loading-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            z-index: 1;
        }
        .loading-tip .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e9ecef;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Token输入弹窗 */
        .token-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .token-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }
        .token-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .token-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        .token-box input:focus {
            border-color: #667eea;
        }
        .token-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .token-box button:hover {
            transform: translateY(-2px);
        }
        .token-box p {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>🎨 工单生图助手</h1>
        </div>
        <div id="coze-chat">
            <div class="loading-tip" id="loadingTip">
                <div class="spinner"></div>
                <p>正在加载聊天组件...</p>
            </div>
        </div>
    </div>

    <!-- 引入 Coze Web SDK - 使用稳定版本 -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.1.0/libs/cn/index.js"></script>
    
    <script>
        console.log('=== 工单生图助手 开始初始化 ===');
        
        // 从 localStorage 读取Token
        function getToken() {
            const token = localStorage.getItem('coze_token');
            console.log('读取Token:', token ? '已存在' : '不存在');
            return token;
        }
        
        function saveToken(token) {
            localStorage.setItem('coze_token', token);
            console.log('Token已保存');
        }
        
        // 显示Token输入弹窗
        function showTokenModal(callback) {
            console.log('显示Token输入弹窗');
            const modal = document.createElement('div');
            modal.className = 'token-modal';
            modal.innerHTML = `
                <div class="token-box">
                    <h2>🔐 请输入您的 Coze Token</h2>
                    <input type="password" id="tokenInput" placeholder="pat_xxxxxxxxxx" autocomplete="off">
                    <button onclick="submitToken()">确认</button>
                    <p>Token仅保存在您的本地浏览器中，不会上传到服务器</p>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('tokenInput').focus();
            
            // 回车提交
            document.getElementById('tokenInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitToken();
            });
            
            window.submitToken = function() {
                const token = document.getElementById('tokenInput').value.trim();
                if (token) {
                    saveToken(token);
                    document.body.removeChild(modal);
                    callback(token);
                }
            };
        }
        
        // 初始化聊天
        function initChat(token) {
            console.log('开始初始化聊天组件...');
            
            try {
                // 隐藏加载提示
                const loadingTip = document.getElementById('loadingTip');
                if (loadingTip) {
                    loadingTip.style.display = 'none';
                }
                
                // 创建聊天客户端
                new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: '7637934088892661760',
                    },
                    componentProps: {
                        title: '工单生图助手',
                    },
                    auth: {
                        type: 'token',
                        token: token,
                        onRefreshToken: function () {
                            return getToken();
                        }
                    }
                });
                
                console.log('✅ 聊天组件初始化成功');
                
            } catch (error) {
                console.error('❌ 初始化失败:', error);
                alert('初始化失败: ' + error.message);
            }
        }
        
        // 等待页面完全加载后再初始化
        window.addEventListener('load', function() {
            console.log('页面加载完成');
            
            setTimeout(function() {
                const savedToken = getToken();
                if (savedToken) {
                    initChat(savedToken);
                } else {
                    showTokenModal(function(token) {
                        initChat(token);
                    });
                }
            }, 500);
        });
    </script>
</body>
</html>
