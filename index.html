<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量生图系统</title>
<style>
html, body { height: 100%; margin: 0; overflow: hidden; }
#app { width: 100%; height: 100vh; position: relative; }
#app iframe { width: 100% !important; height: 100% !important; border: none !important; position: absolute !important; top: 0 !important; left: 0 !important; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var webSdkScript = document.createElement('script');
webSdkScript.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/builder-web-sdk/0.1.1-beta.1/dist/umd/index.js';
document.head.appendChild(webSdkScript);

webSdkScript.onload = function () {
  new CozeWebSDK.AppWebSDK({
    token: 'pat_Jf0V2d0Zo92jNQ5LrRcJOZR7H62y2qXzFgYJP3Efw3gkpiPAnD3VbtZHPyWI1lTi',
    appId: '7652252774620479497',
    container: '#app',
    userInfo: {
      id: 'user',
      url: 'https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze/coze-logo.png',
      nickname: 'User',
    },
    ui: { className: '' }
  });

  fixIframeFullscreen();
};

function fixIframeFullscreen() {
  const app = document.getElementById('app');
  if (!app) return;
  const observer = new MutationObserver(() => {
    const iframe = app.querySelector('iframe');
    if (iframe) {
      iframe.style.setProperty('width', '100%', 'important');
      iframe.style.setProperty('height', '100%', 'important');
      iframe.style.setProperty('position', 'absolute', 'important');
      iframe.style.setProperty('top', '0', 'important');
      iframe.style.setProperty('left', '0', 'important');
      iframe.style.setProperty('border', 'none', 'important');
    }
  });
  observer.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
}

document.addEventListener('DOMContentLoaded', fixIframeFullscreen);
</script>
</body>
</html>
