<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单生图助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f7fafc;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background: #edf2f7;
        }
        .features {
            text-align: left;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;
        }
        .features h3 {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .features li {
            padding: 8px 0;
            color: #4a5568;
            font-size: 14px;
            list-style: none;
            display: flex;
            align-items: center;
        }
        .features li::before {
            content: "✓";
            color: #48bb78;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎨</div>
        <h1>工单生图助手</h1>
        <p class="subtitle">智能解析Excel工单，批量生成产品图片</p>
        
        <a href="https://www.coze.cn/s/7637934088892661760" target="_blank" class="btn">
            🚀 立即开始使用
        </a>
        
        <button onclick="copyLink()" class="btn btn-secondary">
            📋 复制链接分享
        </button>
        
        <div class="features">
            <h3>功能特点</h3>
            <ul>
                <li>自动解析Excel工单数据</li>
                <li>批量裁剪产品图并上传</li>
                <li>智能调用AI批量生图</li>
                <li>自动打包ZIP并返回下载链接</li>
                <li>支持多Excel轮流排期</li>
            </ul>
        </div>
    </div>
    
    <script>
        function copyLink() {
            const link = 'https://www.coze.cn/s/7637934088892661760';
            navigator.clipboard.writeText(link).then(function() {
                alert('✅ 链接已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
