<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI生图工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .image-upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            transition: border-color 0.3s, background-color 0.3s;
            cursor: pointer;
        }

        .image-upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .image-upload-area.dragover {
            border-color: #667eea;
            background-color: #f0f2ff;
        }

        .image-upload-area p {
            color: #666;
            font-size: 1rem;
        }

        .image-upload-area small {
            color: #999;
            font-size: 0.85rem;
        }

        #imageInput {
            display: none;
        }

        .uploaded-images {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        .uploaded-image {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .uploaded-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .uploaded-image .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .uploaded-image .remove-btn:hover {
            background: rgba(255,0,0,0.8);
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .result-card h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .result-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .result-actions a {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .result-actions a:hover {
            background: #eee;
        }

        .error-message {
            background: #fff5f5;
            border-left: 4px solid #ff4d4f;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            color: #d93026;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .example-prompts {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 12px;
        }

        .example-prompts h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .example-prompts .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-prompts .example {
            padding: 6px 12px;
            background: white;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }

        .example-prompts .example:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AI生图工具</h1>
            <p>输入提示词，生成精美图片</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="prompt">提示词 <span style="color: #ff4d4f;">*</span></label>
                <textarea id="prompt" placeholder="请输入生图提示词，例如：一只可爱的猫咪坐在草地上，阳光明媚，卡通风格"></textarea>
                
                <div class="example-prompts">
                    <h4>💡 示例提示词：</h4>
                    <div class="examples">
                        <span class="example">可爱的猫咪</span>
                        <span class="example">科幻城市夜景</span>
                        <span class="example">油画风格风景</span>
                        <span class="example">中国风山水画</span>
                        <span class="example">未来科技感建筑</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>参考图片（可选）</label>
                <div class="image-upload-area" id="uploadArea">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🖼️</div>
                    <p>点击或拖拽上传图片</p>
                    <small>支持 JPG、PNG、WebP 格式，最多上传5张</small>
                </div>
                <input type="file" id="imageInput" accept="image/*" multiple>
                <div id="uploadStatus" style="margin-bottom: 10px; color: #666; font-size: 0.9rem;">
                    已上传 <span id="uploadCount">0</span> 张图片
                </div>
                <div class="uploaded-images" id="uploadedImages"></div>
            </div>

            <button class="btn btn-primary" id="generateBtn">
                <span>🚀 生成图片</span>
            </button>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-card">
                <h3>✨ 生成结果</h3>
                <img id="resultImage" class="result-image" alt="生成的图片">
                <div class="result-actions">
                    <a id="downloadBtn" href="#" download>⬇️ 下载图片</a>
                    <a id="copyBtn" href="#" onclick="copyUrl(event)">📋 复制链接</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadedImages = [];

        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const uploadedImagesContainer = document.getElementById('uploadedImages');
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const resultSection = document.getElementById('resultSection');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');

        uploadArea.addEventListener('click', () => imageInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        imageInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            for (const file of files) {
                if (uploadedImages.length >= 5) {
                    showError('最多只能上传5张图片');
                    return;
                }
                
                if (!file.type.startsWith('image/')) {
                    showError('请上传图片文件');
                    continue;
                }

                const reader = new FileReader();
                reader.onload = async (e) => {
                    console.log(`正在上传图片: ${file.name}`);
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    try {
                        const response = await fetch('https://sd846kjeviqbc9o0d813g.apigateway-cn-guangzhou.volceapi.com/api/upload', {
                            method: 'POST',
                            body: formData
                        });
                        
                        console.log(`上传响应状态: ${response.status}`);
                        
                        let data;
                        try {
                            const responseText = await response.text();
                            console.log(`原始响应:`, responseText);
                            data = JSON.parse(responseText);
                        } catch (parseError) {
                            console.error(`JSON解析失败:`, parseError);
                            showError(`服务器响应格式错误，请检查后端配置`);
                            return;
                        }
                        
                        console.log(`上传结果:`, data);
                        
                        if (data.success) {
                            const imageData = {
                                id: Date.now(),
                                previewUrl: e.target.result,
                                serverUrl: data.url
                            };
                            uploadedImages.push(imageData);
                            renderUploadedImages();
                        } else {
                            showError(`上传图片失败: ${data.error}`);
                        }
                    } catch (error) {
                        console.error(`上传图片异常:`, error);
                        showError(`上传图片失败: ${error.message}`);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function renderUploadedImages() {
            uploadedImagesContainer.innerHTML = '';
            uploadedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'uploaded-image';
                
                const imgElement = document.createElement('img');
                imgElement.src = img.previewUrl;
                imgElement.alt = '上传的图片';
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => {
                    uploadedImages.splice(index, 1);
                    renderUploadedImages();
                });
                
                div.appendChild(imgElement);
                div.appendChild(removeBtn);
                uploadedImagesContainer.appendChild(div);
            });
            document.getElementById('uploadCount').textContent = uploadedImages.length;
        }

        document.querySelectorAll('.example').forEach(el => {
            el.addEventListener('click', () => {
                promptInput.value = el.textContent;
            });
        });

        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            
            if (!prompt) {
                showError('请输入提示词');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading-spinner"></span>生成中...';
            hideError();
            resultSection.classList.remove('show');

            const imageUrls = uploadImagesToServer();
            
            console.log(`当前uploadedImages数组:`, uploadedImages);
            console.log(`要发送的图片URL数量: ${imageUrls.length}`);
            console.log(`要发送的图片URL列表:`, imageUrls);

            try {
                const requestData = {
                    prompt: prompt,
                    images: imageUrls,
                    timeout: 600
                };
                console.log(`发送给API的数据:`, JSON.stringify(requestData, null, 2));
                
                const controller = new AbortController();
                const timeoutMs = 600000;
                const startTime = Date.now();
                
                const timeoutPromise = new Promise((_, reject) => {
                    const timeoutId = setTimeout(() => {
                        controller.abort();
                        reject(new Error(`请求超时（${Math.floor(timeoutMs / 1000)}秒）`));
                    }, timeoutMs);
                });
                
                const fetchPromise = fetch('https://sd85bjva3fghtjddkv31g.apigateway-cn-guangzhou.volceapi.com/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData),
                    signal: controller.signal
                }).then(async (response) => {
                    console.log(`生成响应状态: ${response.status}`);
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    
                    let data;
                    try {
                        const responseText = await response.text();
                        console.log(`原始响应:`, responseText);
                        data = JSON.parse(responseText);
                    } catch (parseError) {
                        console.error(`JSON解析失败:`, parseError);
                        throw new Error(`服务器响应格式错误`);
                    }
                    return data;
                });

                const data = await Promise.race([fetchPromise, timeoutPromise]);

                if (data.success) {
                    resultImage.src = data.url;
                    downloadBtn.href = data.url;
                    downloadBtn.download = `generated_${Date.now()}.png`;
                    resultSection.classList.add('show');
                } else {
                    showError(data.error || '生图失败');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    showError('请求超时，请稍后重试');
                } else {
                    showError('请求失败：' + error.message);
                }
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<span>🚀 生成图片</span>';
            }
        });

        function uploadImagesToServer() {
            const urls = uploadedImages.map(img => img.serverUrl);
            console.log(`已上传的图片URL:`, urls);
            return urls;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function copyUrl(event) {
            event.preventDefault();
            const url = resultImage.src;
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制到剪贴板');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
</body>
</html>
